name: 累積台指期 1 分K

on:
  schedule:
    # 台北時間週一到週六 06:30（夜盤收盤後）。期交所只保留 30 個交易日，所以每天存一次。
    - cron: "30 22 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: write

# 和策略即時訊號寫同一批檔案（docs/live.*、history/tx_1min），排同一組才不會同時改到
concurrency:
  group: strategy-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 下載期交所每筆成交並轉成 1 分K
        run: python strategy/collect_ticks.py history/tx_1min
      - name: 更新加權指數 60 分K（Yahoo）
        run: python strategy/fetch_twii.py history/twii_60min.csv || echo "Yahoo 抓取失敗，略過"
      - name: v3 前測（模擬交易紀錄與網頁）
        run: cd strategy && python forward.py ../history/tx_1min ../docs/strategy.html ../history/forward_trades.csv
      - name: 更新台指期每日行情（日K 研究用，即時訊號頁已不用）
        run: python strategy/fetch_tx_daily.py history/tx_daily.csv || echo "期交所每日行情抓取失敗，略過"
      - name: v3（限時段／不限時段）即時訊號頁與成交紀錄
        run: python strategy/live.py --out docs
      - name: 存回 repo
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add history/tx_1min history/tx_daily.csv history/twii_60min.csv history/forward_trades.csv docs/strategy.html docs/live.html docs/live.json docs/trades.html
          git diff --cached --quiet && exit 0
          git commit -m "累積台指期 1 分K $(TZ=Asia/Taipei date '+%F')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
