name: 策略即時訊號

on:
  schedule:
    # 時間為 UTC（台北 = UTC+8），週一到週五，只在交易時段跑。
    # 日盤 08:45–13:45：60 分K 在每個 :45 收，所以排在台北 :48，加 :18 湊成每半小時。
    - cron: "48 0-5 * * 1-5"
    - cron: "18 1-5 * * 1-5"
    # 夜盤 15:00–05:00：60 分K 在整點收，排在台北 :04、:34（週一到週五晚上；跨到隔天清晨在 UTC 仍是同一天）。
    - cron: "4,34 7-20 * * 1-5"
    - cron: "4 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: strategy-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓即時 1 分K，算 v3（限時段／不限時段）目前狀態
        run: python strategy/live.py --out docs
      - name: 存回 repo
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add docs/live.html docs/live.json docs/trades.html history/tx_1min
          git diff --cached --quiet && exit 0
          git commit -m "策略訊號 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
